name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  build-apk:
    name: Build APK
    needs: check
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Set up release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
        run: |
          flutter build apk --release --dart-define=ESRI_API_KEY="$ESRI_API_KEY"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "ggmap-${GITHUB_SHA::7}-release.apk"

      - name: Build debug APK (no signing key configured)
        if: env.HAS_KEYSTORE != 'true'
        env:
          ESRI_API_KEY: ${{ secrets.ESRI_API_KEY }}
        run: |
          flutter build apk --debug --dart-define=ESRI_API_KEY="$ESRI_API_KEY"
          mv build/app/outputs/flutter-apk/app-debug.apk \
             "ggmap-${GITHUB_SHA::7}-DEBUG-not-a-release.apk"

      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: ggmap-apk
          path: ggmap-*.apk
          retention-days: 14
